# Publishes the site as plain files to GitHub Pages on every push to main.
# The repository must be named <your-username>.github.io (the site uses root-relative paths).
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile || bun install
      - name: List every page
        run: bun scripts/github-pages-paths.ts
      - name: Export the site
        run: bunx vite build
        env:
          GITHUB_PAGES: "true"
          VITE_GITHUB_PAGES: "true"
      - name: Add GitHub Pages extras
        run: |
          # The export lands in .output/public on GitHub runners and dist/client in some setups.
          if [ -f .output/public/index.html ]; then OUT=.output/public; else OUT=dist/client; fi
          test -f "$OUT/index.html" || { echo "No exported pages found"; exit 1; }
          rm -rf site && cp -r "$OUT" site
          cp scripts/github-pages-404.html site/404.html
          touch site/.nojekyll
          rm -f site/_headers
          echo "Exported $(find site -name index.html | wc -l) pages from $OUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
